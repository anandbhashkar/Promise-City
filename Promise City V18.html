<style>

.hide{opacity:0;pointer-events:none;visibility:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;transition:background .25s}

.row{display:flex;gap:8px;justify-content:space-between}
#list{position:fixed;right:20px;top:calc(18px + env(safe-area-inset-top,0px));width:240px;padding:8px;max-height:calc(100% - 140px);overflow:auto}

#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:10px 16px;display:flex;gap:12px;align-items:center;font-size:14px}
input[type=range]{accent-color:var(--teal);width:130px}
.pin{position:fixed;left:0;top:0;pointer-events:none;transition:opacity .4s}

@media(max-width:760px){#list{display:none}#head{display:none}#story p{font-size:14px;min-height:60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
